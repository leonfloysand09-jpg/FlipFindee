<!doctype html><html lang="no"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b0d10"><link rel="manifest" href="manifest.json"><title>FlipFinder</title><style>body{margin:0;background:#0b0d10;color:#f5f7fa;font:16px system-ui}main{max-width:700px;margin:auto;padding:24px}h1{margin-bottom:4px}.muted{color:#9da4ad}label{display:block;margin-top:16px;font-weight:700}input,textarea,button{width:100%;box-sizing:border-box;border-radius:14px;border:1px solid #2b3139;background:#14181e;color:#fff;padding:13px;font:inherit}textarea{min-height:120px}button{margin-top:18px;background:#fff;color:#000;font-weight:800}.card{background:#11151b;border:1px solid #272d35;border-radius:18px;padding:18px;margin-top:18px}.score{font-size:42px;font-weight:900}.good{color:#7ee787}.bad{color:#ff7b72}a{color:#8ab4ff}</style></head><body><main><h1>FlipFinder</h1><div class="muted">AI-deal finder for FINN/Tise</div><div class="card"><label>Merker</label><input id="brands" placeholder="Polo Ralph Lauren, Replay, Jacob Cohen"><label>Produkttyper</label><input id="types" placeholder="half zip, genser, jeans"><label>Størrelser</label><input id="sizes" placeholder="M, L"><label>Makspris</label><input id="max" type="number" value="600"><label>Minimum score for varsel</label><input id="min" type="number" value="80"><button onclick="save()">Lagre profil</button></div><div class="card"><label>Test en annonse</label><textarea id="listing" placeholder="Lim inn annonsetekst + link her"></textarea><label>Lignende annonser (valgfritt)</label><textarea id="comps" placeholder="Lim inn 3–10 lignende annonser med pris + link. AI bruker disse som sammenligningsgrunnlag."></textarea><button onclick="analyze()">Analyser med AI</button><div id="out"></div></div></main><script>const ids=['brands','types','sizes','max','min'];function save(){const p={};ids.forEach(i=>p[i]=document.getElementById(i).value);localStorage.ff=JSON.stringify(p);alert('Profil lagret')}function load(){try{const p=JSON.parse(localStorage.ff);ids.forEach(i=>document.getElementById(i).value=p[i]??document.getElementById(i).value)}catch{}}async function analyze(){const out=document.getElementById('out');out.innerHTML='<p>Analyserer...</p>';const p={brands:brands.value,types:types.value,sizes:sizes.value,max_price_nok:max.value,min_score:min.value};const r=await fetch('/api/analyze',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({profile:p,listing:listing.value,comps:comps.value})});const d=await r.json();if(d.error){out.innerHTML='<p class="bad">'+d.error+'</p>';return}out.innerHTML='<div class="card"><div class="score '+(d.match_score>=80?'good':'')+'">'+d.match_score+'/100</div><p><b>'+ (d.notify?'🔥 VARSEL':'Ikke varsle')+'</b></p><p>'+ (d.reason||'')+'</p><p>Innkjøpspris: '+(d.price_nok??'?')+' kr<br>Markedsverdi: '+(d.estimated_resale_low??'?')+'–'+(d.estimated_resale_high??'?')+' kr<br><b>Maks profitt-pris: '+(d.max_profit_sale_price??'?')+' kr</b><br>Raskt salg: '+(d.quick_sale_price??'?')+' kr<br>Estimert profitt: '+(d.estimated_profit_low??'?')+'–'+(d.estimated_profit_high??'?')+' kr<br>Etter gebyr/frakt: '+(d.net_profit_after_costs??'?')+' kr<br>Risiko: '+(d.risk||'?')+'</p><p class="muted">'+(d.pricing_reason||'')+'</p></div>'}load()</script></body></html>
